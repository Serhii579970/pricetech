<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта магазинів | PriceTech</title>

    <!-- Стилі Leaflet та MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Власні стилі -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pricetech-locator" id="pricetechLocator">
        <!-- Верхня панель керування -->
        <div class="pt-controls">
            <!-- Пошук за містом -->
            <div class="pt-search-wrapper">
                <input type="text" id="citySearch" placeholder="Оберіть або введіть місто..." autocomplete="off">
                <ul id="autocompleteList" class="pt-autocomplete-list"></ul>
            </div>

            <!-- Пошук за назвою магазину -->
            <div class="pt-search-wrapper">
                <input type="text" id="nameSearch" placeholder="Назва (напр. Експрес, Форум)..." autocomplete="off">
            </div>

            <!-- Єдина кнопка-перемикач: Моє місцезнаходження / Скинути -->
            <button id="geoBtn" class="pt-btn" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M12 2L22 22L12 18L2 22L12 2Z"></path>
                </svg>
                Моє місцезнаходження
            </button>

            <!-- Кнопка повноекранного режиму -->
            <button id="fullscreenBtn" class="pt-btn pt-fullscreen-btn" type="button" title="На весь екран" aria-label="На весь екран">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>

        <!-- Основний контент: Список зліва, Карта справа -->
        <div class="pt-content">
            <aside class="pt-sidebar" id="sidebar">
                <div id="storesList" class="pt-stores-list"></div>
            </aside>

            <div class="pt-map-container" id="mapContainer">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- 1. Підключення баз даних -->
    <script src="storesDB.js"></script>
    <script src="citiesDB.js"></script>

    <!-- 2. Підключення Leaflet та MarkerCluster -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- 3. Основна логіка додатку -->
    <script src="app.js"></script>

</body>
</html>
